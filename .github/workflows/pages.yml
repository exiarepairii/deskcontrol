name: Publish website

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-website
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Publish to gh-pages
        env:
          PAGES_WORKTREE: ${{ runner.temp }}/deskcontrol-gh-pages
        run: |
          git fetch origin gh-pages
          git worktree add -B gh-pages "$PAGES_WORKTREE" origin/gh-pages
          rsync -a --delete --exclude ".git" site/ "$PAGES_WORKTREE"/
          touch "$PAGES_WORKTREE/.nojekyll"
          cd "$PAGES_WORKTREE"
          git add --all
          if git diff --cached --quiet; then
            echo "Website is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "publish website"
          git push origin HEAD:gh-pages
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
